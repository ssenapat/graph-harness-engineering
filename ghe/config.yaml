# ghe/config.yaml — per-project GHE configuration (spec §10.4)
config_version: 2        # managed by `ghe update`; do not lower
tracker: local           # jira | local. /ghe-setup switches to jira once the values below are filled in
jira:                    # placeholders: set per project by /ghe-setup. Never commit real org values to a shared toolkit.
  site: "https://<your-org>.atlassian.net"
  project: "<JIRA_PROJECT_KEY>"   # the skill refuses to write to any other project
  board_id: null         # optional (numeric)
  epic_type: Epic
  task_type: Task
  story_type: Story      # F17: Epic > Story > Sub-task; falls back to Task if the project lacks it
  subtask_type: Sub-task
  assign_to: none        # account id | requester | none  (who new tickets are assigned to)
defaults:
  roster: [ba, architect, qa, builder, devops, tester]   # Reviewer is opt-in
  deploy_target: local   # local | cloud
  max_parallel_agents: 4
  test_concurrency: 4
budgets:
  # No token limits: usage is recorded (`tokens`) and reported, never capped.
  # Four different limits, never interchangeable (F10/F11):
  node_retry: 1                      # TECHNICAL retries of one node after a failed/invalid attempt (extra starts)
  max_rounds: 3                      # VERIFICATION rounds: test -> triage -> fix (each round re-tests)
  correction_scope: story        # story (default: unrelated stories don't share allowances) | epic_global (one shared cap, T61)
  max_story_revisions: 1             # SUBSTANTIVE correction: one revision of a story, then escalate
  max_gate_revisions: 1              # one design/plan batch change per gate, then escalate
  max_design_batches: 1              # approved design-revision batches per run (F19/F11), then escalate
models:                              # tiers: top | mid | small  (mapped by the runner)
  architect: top
  builder_planner: top
  builder_integration: top
  default: mid
  mechanical: small
cost:                                # expense report (ghe/expenses/): price per 1M tokens, per model tier
  currency: USD
  prices: {}                         # e.g. {top: {in: 15, out: 75, cache: 1.5}, mid: {...}, small: {...}}; empty = tokens only
validation:
  commands: []                       # filled by /ghe-setup (test / lint / typecheck / build)
lint:
  rules: []                          # [{glob: "*.py", command: "ruff check {file}"}]
gates:
  reviewer: false
  cloud_apply: true
  destructive: true
aws: {}                              # no defaults: region/account/credentials come from the requester per run
docs_vault:
  enabled: false
memory:                             # F22: bounded, relevance-scoped retrieval (runner `memory-manifest`)
  max_entries: 12                   # entries selected per packet
  max_chars: 6000                   # hard character budget; an essential entry that cannot fit pauses, never truncates
